<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-labelledby="title desc">
  <title id="title">FlyHigh booking saga</title>
  <desc id="desc">A booking saga checks miles, reserves seats, creates the booking and debits miles. Failures trigger compensating steps.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#db663e" stroke-width="1.5"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#17272d}.small{font-size:15px;fill:#68777a;letter-spacing:1px}.label{font-size:18px;font-weight:700}.detail{font-size:14px;fill:#536268}.box{fill:#fff;stroke:#cad4d3;stroke-width:2}.step{fill:#e4eee9;stroke:#9bb9ac;stroke-width:2}.arrow{fill:none;stroke:#db663e;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1000" height="625" fill="#f3f1ea"/>
  <text x="46" y="54" class="small">FLYHIGH / SAGA DE RESERVA</text>
  <text x="46" y="91" font-size="30" font-weight="700">Uma reserva, vários serviços</text>
  <rect x="46" y="144" width="170" height="92" rx="15" class="box"/><text x="67" y="184" class="label">Frontend</text><text x="67" y="209" class="detail">React</text>
  <path d="M217 190H251" class="arrow"/>
  <rect x="257" y="144" width="170" height="92" rx="15" class="box"/><text x="278" y="184" class="label">API Gateway</text><text x="278" y="209" class="detail">Node.js</text>
  <path d="M428 190H462" class="arrow"/>
  <rect x="468" y="144" width="194" height="92" rx="15" class="box"/><text x="489" y="184" class="label">Orquestrador</text><text x="489" y="209" class="detail">Spring Boot · Saga</text>
  <path d="M663 190H697" class="arrow"/>
  <rect x="703" y="144" width="249" height="92" rx="15" class="box"/><text x="724" y="184" class="label">RabbitMQ</text><text x="724" y="209" class="detail">comandos e respostas</text>
  <g class="step"><rect x="46" y="310" width="209" height="120" rx="15"/><rect x="279" y="310" width="209" height="120" rx="15"/><rect x="512" y="310" width="209" height="120" rx="15"/><rect x="745" y="310" width="209" height="120" rx="15"/></g>
  <text x="65" y="343" class="small">01</text><text x="65" y="375" class="label">Consultar milhas</text><text x="65" y="401" class="detail">MS Cliente</text>
  <text x="298" y="343" class="small">02</text><text x="298" y="375" class="label">Reservar assentos</text><text x="298" y="401" class="detail">MS Voos</text>
  <text x="531" y="343" class="small">03</text><text x="531" y="375" class="label">Criar reserva</text><text x="531" y="401" class="detail">MS Reserva</text>
  <text x="764" y="343" class="small">04</text><text x="764" y="375" class="label">Debitar milhas</text><text x="764" y="401" class="detail">MS Cliente</text>
  <path d="M256 370H275M489 370H508M722 370H741" class="arrow"/>
  <rect x="46" y="493" width="908" height="86" rx="15" fill="#fae5dd" stroke="#e3aa95" stroke-width="2"/>
  <text x="67" y="529" class="label">Se uma etapa falha</text><text x="67" y="555" class="detail">A saga aciona compensações, como devolver assentos e desfazer a reserva.</text>
</svg>
