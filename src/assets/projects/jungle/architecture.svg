<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img"><style>text{font-family:Arial,sans-serif;fill:#202e25}.title{font-size:25px;font-weight:600}.label{font-size:21px;font-weight:600}.small{font-size:16px;fill:#4c6052}.box{fill:#fff;stroke:#b6c6b7;stroke-width:1.5}.accent{fill:#e6eee4;stroke:#7c9c7f;stroke-width:1.5}.arrow{fill:none;stroke:#557c5b;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#557c5b"/></marker></defs><rect width="900" height="560" fill="#f8faf7"/><title>Jungle: architecture and boundaries</title><text x="36" y="46" class="title">Jungle / architecture</text><text x="36" y="76" class="small">One application, two entry points. PostgreSQL is the source of truth.</text>
