<rect x="320" y="150" width="240" height="176" rx="5" class="accent"/><text x="340" y="190" class="label">WageringService</text><text x="340" y="222" class="small">Shared use case</text><text x="340" y="250" class="small">Money / Wallet / Ledger</text><text x="340" y="278" class="small">Per-wallet lock + SQL tx</text>
<path d="M560 238H640" class="arrow"/><rect x="640" y="158" width="224" height="160" rx="5" class="box"/><text x="661" y="194" class="label">PostgreSQL</text><text x="661" y="228" class="small">Wallets + transactions</text><text x="661" y="254" class="small">Append-only ledger</text><text x="661" y="280" class="small">Inbox + outbox</text>
