<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img">
  <style>
:root { --surface: #f3eee3; --card: #faf6ed; --shade: #e2dacb; --ink: #111111; --muted: #514c44; --line: #9c9385; --edge: #756b5e; --arrow: #574f43; }
@media (prefers-color-scheme: dark) {
  :root { --surface: #171614; --card: #201e1b; --shade: #322e28; --ink: #f3eee3; --muted: #cac2b5; --line: #736b5f; --edge: #9f9482; --arrow: #d4c7b3; }
}
text{font-family:Arial,sans-serif;fill:var(--ink)}
.title{font-size:25px;font-weight:600}
.label{font-size:21px;font-weight:600}
.small{font-size:16px;fill:var(--muted)}
.box{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--shade);stroke:var(--edge);stroke-width:1.5}
.arrow{fill:none;stroke:var(--arrow);stroke-width:2;marker-end:url(#a)}
</style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="var(--arrow)"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="var(--surface)"/>
  <title>Jungle: failure recovery paths</title>
  <text x="36" y="46" class="title">Jungle / failure recovery</text>
  <text x="36" y="76" class="small">Persist the state first. Retries must not repeat the financial effect.</text>
  <rect x="36" y="118" width="828" height="106" rx="5" class="box"/>
  <text x="56" y="150" class="label">Commit succeeded, consumer crashed before ack</text>
  <text x="56" y="184" class="small">SQS redelivery → inbox + idempotency → saved result, no second debit.</text>
  <text x="56" y="207" class="small">The database protects the balance beyond the FIFO deduplication window.</text>
  <rect x="36" y="244" width="828" height="106" rx="5" class="accent"/>
  <text x="56" y="276" class="label">Event sent, publisher crashed before marking it</text>
  <text x="56" y="310" class="small">Outbox retry → possible duplicate event → consumers deduplicate by eventId.</text>
  <text x="56" y="333" class="small">At-least-once, not exactly-once. Projections consider walletVersion.</text>
  <rect x="36" y="370" width="828" height="106" rx="5" class="box"/>
  <text x="56" y="402" class="label">Refund / rollback arrives before its reference</text>
  <text x="56" y="436" class="small">PENDING_REFERENCE → persistent worker retries → process or expire.</text>
  <text x="56" y="459" class="small">Transient failure: backoff. Invalid commands / exhausted retries: DLQ.</text>
  <text x="36" y="525" class="small">Assessment project. No active authentication, load benchmark or public deployment.</text>
</svg>
