<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img"><style>text{font-family:Arial,sans-serif;fill:#202e25}.title{font-size:25px;font-weight:600}.label{font-size:21px;font-weight:600}.small{font-size:16px;fill:#4c6052}.box{fill:#fff;stroke:#b6c6b7;stroke-width:1.5}.accent{fill:#e6eee4;stroke:#7c9c7f;stroke-width:1.5}.arrow{fill:none;stroke:#557c5b;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#557c5b"/></marker></defs><rect width="900" height="560" fill="#f8faf7"/><title>Jungle: transaction and idempotency</title><text x="36" y="46" class="title">Jungle / transaction</text><text x="36" y="76" class="small">HTTP and SQS execute the same business operation.</text>
<rect x="36" y="120" width="230" height="86" rx="5" class="box"/><text x="55" y="153" class="label">Validate command</text><text x="55" y="181" class="small">Money + payload hash</text>
<path d="M266 163H335" class="arrow"/><rect x="335" y="120" width="230" height="86" rx="5" class="box"/><text x="354" y="153" class="label">Lock wallet</text><text x="354" y="181" class="small">SELECT ... FOR UPDATE</text>
<path d="M565 163H634" class="arrow"/><rect x="634" y="120" width="230" height="86" rx="5" class="box"/><text x="653" y="153" class="label">Check idempotency</text><text x="653" y="181" class="small">Key + external ID + hash</text>
<path d="M749 206V252" class="arrow"/><rect x="36" y="252" width="828" height="152" rx="5" class="accent"/><text x="56" y="288" class="label">Same SQL transaction</text><text x="56" y="328" class="small">Operation + balance/version + ledger + inbox (SQS) + outbox</text><text x="56" y="362" class="small">New command: validate business rules and persist. Failure: rollback.</text><text x="56" y="387" class="small">Replay: return saved result. Changed payload: conflict, no new movement.</text>
<path d="M450 404V448" class="arrow"/><rect x="250" y="448" width="400" height="65" rx="5" class="box"/><text x="272" y="477" class="label">COMMIT</text><text x="272" y="500" class="small">Then respond / SQS ack / publish events</text></svg>
