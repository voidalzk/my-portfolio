<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img">
  <style>
:root { --surface: #f3eee3; --card: #faf6ed; --shade: #e2dacb; --ink: #111111; --muted: #514c44; --line: #9c9385; --edge: #756b5e; --arrow: #574f43; }
@media (prefers-color-scheme: dark) {
  :root { --surface: #171614; --card: #201e1b; --shade: #322e28; --ink: #f3eee3; --muted: #cac2b5; --line: #736b5f; --edge: #9f9482; --arrow: #d4c7b3; }
}
text{font-family:Arial,sans-serif;fill:var(--ink)}
.title{font-size:25px;font-weight:600}
.label{font-size:21px;font-weight:600}
.small{font-size:16px;fill:var(--muted)}
.box{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--shade);stroke:var(--edge);stroke-width:1.5}
.arrow{fill:none;stroke:var(--arrow);stroke-width:2;marker-end:url(#a)}
</style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="var(--arrow)"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="var(--surface)"/>
  <title>Jungle: transaction and idempotency</title>
  <text x="36" y="46" class="title">Jungle / transaction</text>
  <text x="36" y="76" class="small">HTTP and SQS execute the same business operation.</text>
  <rect x="36" y="120" width="230" height="86" rx="5" class="box"/>
  <text x="55" y="153" class="label">Validate command</text>
  <text x="55" y="181" class="small">Money + payload hash</text>
  <path d="M266 163H335" class="arrow"/>
  <rect x="335" y="120" width="230" height="86" rx="5" class="box"/>
  <text x="354" y="153" class="label">Lock wallet</text>
  <text x="354" y="181" class="small">SELECT ... FOR UPDATE</text>
  <path d="M565 163H634" class="arrow"/>
  <rect x="634" y="120" width="230" height="86" rx="5" class="box"/>
  <text x="653" y="153" class="label">Check idempotency</text>
  <text x="653" y="181" class="small">Key + external ID + hash</text>
  <path d="M749 206V252" class="arrow"/>
  <rect x="36" y="252" width="828" height="152" rx="5" class="accent"/>
  <text x="56" y="288" class="label">Same SQL transaction</text>
  <text x="56" y="328" class="small">Operation + balance/version + ledger + inbox (SQS) + outbox</text>
  <text x="56" y="362" class="small">New command: validate business rules and persist. Failure: rollback.</text>
  <text x="56" y="387" class="small">Replay: return saved result. Changed payload: conflict, no new movement.</text>
  <path d="M450 404V448" class="arrow"/>
  <rect x="250" y="448" width="400" height="65" rx="5" class="box"/>
  <text x="272" y="477" class="label">COMMIT</text>
  <text x="272" y="500" class="small">Then respond / SQS ack / publish events</text>
</svg>
